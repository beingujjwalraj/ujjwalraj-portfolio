    <!-- Style to permanently suppress Netlify Drawer / Feedback HUD -->
    <style>
      #netlify-hud,
      .netlify-hud,
      [data-netlify-hud],
      div[class*="netlify-hud"],
      div[id*="netlify-hud"],
      iframe[src*="netlify.com"],
      iframe[id*="netlify"],
      div:has(> iframe[src*="netlify"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        bottom: -9999px !important;
        z-index: -99999 !important;
      }
    </style>

    <!-- Netlify form detection placeholder -->

      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <!-- Script to automatically remove any injected Netlify HUD element -->
    <script>
      (function() {
        function removeNetlifyHud() {
          var badEls = document.querySelectorAll('#netlify-hud, .netlify-hud, [data-netlify-hud], iframe[src*="netlify"]');
          badEls.forEach(function(el) {
            try { el.remove(); } catch (e) {}
          });
        }
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function() { removeNetlifyHud(); });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyHud);
        window.addEventListener('load', removeNetlifyHud);
      })();
    </script>
